function FormModal({title,fields,defaults={},onSave,onClose}){
  const [f,setF]=useState({...defaults});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const valid=fields.filter(x=>x.req).every(x=>f[x.key]&&f[x.key]!=="");
  return <Modal onClose={onClose} title={title}>
    <div style={{display:"flex",flexDirection:"column",gap:".75rem"}}>
      {fields.map(fd=>(
        <div key={fd.key}>
          <label style={{display:"block",fontSize:".7rem",color:C.inkDim,textTransform:"uppercase",letterSpacing:".06em",marginBottom:".28rem"}}>{fd.label}{fd.req?" *":""}</label>
          {fd.type==="select"
            ?<select style={inputSt} value={f[fd.key]||""} onChange={e=>set(fd.key,e.target.value)}>{fd.opts.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>
            :fd.type==="textarea"
            ?<textarea style={{...inputSt,resize:"vertical"}} rows={fd.rows||3} value={f[fd.key]||""} onChange={e=>set(fd.key,e.target.value)} placeholder={fd.placeholder||""}/>
            :<input style={inputSt} type={fd.type||"text"} value={f[fd.key]||""} onChange={e=>set(fd.key,e.target.value)} placeholder={fd.placeholder||""}/>}
        </div>
      ))}
    </div>
    <div style={{display:"flex",gap:".65rem",marginTop:"1.25rem"}}>
      <button onClick={onClose} style={{flex:1,background:C.cream2,color:C.inkLight,padding:".7rem",borderRadius:".75rem",fontSize:".88rem",border:"none",cursor:"pointer"}}>Annuler</button>
      <button onClick={()=>valid&&onSave(f)} style={{flex:2,background:valid?C.forest:"#ccc",color:"#fff",padding:".7rem",borderRadius:".75rem",fontSize:".88rem",border:"none",cursor:valid?"pointer":"not-allowed",fontWeight:600}}>Enregistrer</button>
    </div>
  </Modal>;
}

function PropFormModal({initial={},onSave,onClose}){

  const [showSyn,setShowSyn]=useState(!!initial.syndic);

    if(!f.nom||!f.adresse)return;
    onSave({...f,id:initial.id||Date.now(),surface:+f.surface||0,loyer:+f.loyer||0,charges:+f.charges||0,caution:+f.caution||0,
      locataire:showLoc&&loc?.nom?loc:null,syndic:showSyn&&syn?.nom?syn:null});

      <div><label style={{display:"block",fontSize:".7rem",color:C.inkDim,textTransform:"uppercase",letterSpacing:".06em",marginBottom:".28rem"}}>Surface (m²)</label><input style={inputSt} type="number" value={f.surface} onChange={e=>set("surface",e.target.value)}/></div>
