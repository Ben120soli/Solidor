<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#1a3a2a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Solidor Immo"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Solidor Immo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Georgia,serif;background:#f5f2ed;min-height:100vh}
button{cursor:pointer;border:none;font-family:inherit;outline:none}
input,select,textarea{font-family:inherit;outline:none}
::-webkit-scrollbar{display:none}
#app{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.card{background:#fff;border-radius:1rem;box-shadow:0 2px 12px rgba(45,40,32,.08);padding:1rem}
.row{display:flex;align-items:center;gap:.65rem;padding:.75rem .85rem;border-bottom:1px solid #f5f2ed}
.row:last-child{border-bottom:none}
.row:active{background:#faf9f7}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:.68rem;padding:.22rem .6rem;border-radius:2rem;font-weight:600;white-space:nowrap}
.chip{display:inline-block;font-size:.68rem;padding:.18rem .55rem;border-radius:2rem;font-weight:600;white-space:nowrap}
.tab{padding:.45rem .85rem;border-radius:.55rem;font-size:.78rem;background:none;color:#8a7968;white-space:nowrap}
.tab.on{background:#1a3a2a;color:#fff;font-weight:600}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.5rem .25rem;background:none;color:#8a7968;font-size:.6rem;flex:1}
.navbtn.on{color:#1a3a2a}
.navbtn .ni{font-size:1.3rem;line-height:1}
.input{width:100%;padding:.6rem .85rem;border:1.5px solid #ddd8cf;border-radius:.6rem;background:#faf9f7;font-size:.85rem;color:#2d2820}
.input:focus{border-color:#1a3a2a;background:#fff}
.btn-primary{background:#1a3a2a;color:#fff;padding:.7rem 1.25rem;border-radius:.75rem;font-size:.88rem;font-weight:600;width:100%;cursor:pointer}
.btn-secondary{background:#ede8e0;color:#5a4e42;padding:.7rem 1.25rem;border-radius:.75rem;font-size:.88rem;width:100%;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(10,18,35,.7);z-index:2000;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.sheet{background:#fff;border-radius:1.25rem 1.25rem 0 0;padding:1.25rem 1.25rem 2rem;width:100%;max-width:600px;max-height:92vh;overflow-y:auto}
.drag{width:36px;height:4px;border-radius:2px;background:#ddd8cf;margin:0 auto .9rem}
.header{background:#1a3a2a;color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 1rem}
.hbtn{background:rgba(255,255,255,.15);color:#fff;border-radius:.6rem;padding:.35rem .7rem;font-size:.75rem;cursor:pointer}
.main{flex:1;overflow-y:auto;padding:1rem;padding-bottom:5rem}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;background:#fff;border-top:1px solid #ddd8cf;display:flex;padding:.4rem .5rem .5rem;z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,.08)}
.kpi{border-radius:1rem;padding:.85rem;background:#fff;box-shadow:0 2px 12px rgba(45,40,32,.08)}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.sec-title{font-size:.9rem;font-weight:700;color:#1a3a2a;margin:0}
.add-btn{background:#1a3a2a;color:#fff;border:none;border-radius:.55rem;padding:.38rem .8rem;font-size:.75rem;cursor:pointer}
.empty{text-align:center;padding:1.5rem;color:#a89a88;font-size:.85rem}
.prop-card{background:#fff;border-radius:1rem;box-shadow:0 2px 12px rgba(45,40,32,.08);overflow:hidden;cursor:pointer;margin-bottom:1rem}
.prop-card:active{opacity:.9}
.sec-toggle{font-size:.78rem;font-weight:700;color:#1a3a2a;text-transform:uppercase;letter-spacing:.05em;margin:1rem 0 .65rem;padding-top:.85rem;border-top:1px solid #ddd8cf;display:flex;align-items:center;gap:.5rem;cursor:pointer;background:none;width:100%;text-align:left}
.save-indicator{position:fixed;top:60px;right:12px;background:#1a3a2a;color:#fff;font-size:.72rem;padding:.3rem .75rem;border-radius:2rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.save-indicator.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-inner">
      <div style="display:flex;align-items:center;gap:.55rem">
        <button id="backBtn" class="hbtn" style="display:none;margin-right:.25rem">←</button>
        <span style="font-size:1.1rem">🗝️</span>
        <span style="font-weight:700;font-size:.95rem;letter-spacing:.02em">Solidor Immo</span>
      </div>
      <div style="display:flex;gap:.5rem">
        <button class="hbtn" id="aiBtn">🤖 IA</button>
        <button class="hbtn" id="addPropBtn">+ Bien</button>
      </div>
    </div>
  </div>
  <div class="save-indicator" id="saveIndicator">✓ Sauvegardé</div>
  <div class="main" id="main"></div>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<script>
// ── HELPERS ──
const fmt=n=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const fmtDate=d=>d?new Date(d).toLocaleDateString("fr-FR"):"—";
const moisLabel=m=>{if(!m)return"—";const[y,mo]=m.split("-");return new Date(y,mo-1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"})};
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):"";
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const gv=id=>document.getElementById(id)?.value||"";

// ── SAUVEGARDE LOCALE ──
const STORAGE_KEY="solidor_immo_v2";
function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state.data));
    const ind=document.getElementById("saveIndicator");
    if(ind){ind.classList.add("show");setTimeout(()=>ind.classList.remove("show"),1500);}
  }catch(e){}
}
function loadData(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(saved)return JSON.parse(saved);
  }catch(e){}
  return null;
}

// ── DONNÉES INITIALES ──
const DEFAULT_DATA={
  properties:[
    {id:1,nom:"Appt Haussmannien",adresse:"12 Rue de Rivoli, 75001 Paris",type:"Appartement",surface:78,image:"🏛️",statut:"loué",loyer:1850,charges:220,caution:3700,notes:"Parquet ancien, double vitrage refait 2022.",
     locataire:{nom:"Marie Dupont",email:"marie.dupont@email.fr",tel:"06 12 34 56 78",dateEntree:"2023-03-01"},
     syndic:{nom:"Syndic Rivoli",contact:"contact@syndic-rivoli.fr",tel:"01 40 00 11 22",cotisation:180}},
    {id:2,nom:"Studio Montmartre",adresse:"7 Rue Lepic, 75018 Paris",type:"Studio",surface:28,image:"🏠",statut:"vacant",loyer:890,charges:80,caution:0,notes:"Travaux peinture prévus juillet.",locataire:null,syndic:null},
  ],
  loyers:[
    {id:1,propId:1,mois:"2024-05",montant:2070,statut:"payé",datePaiement:"2024-05-03",notes:""},
    {id:2,propId:1,mois:"2024-06",montant:2070,statut:"payé",datePaiement:"2024-06-02",notes:""},
    {id:3,propId:1,mois:"2024-07",montant:2070,statut:"retard",datePaiement:"",notes:"Relance envoyée le 10/07"},
    {id:4,propId:1,mois:"2024-08",montant:2070,statut:"impayé",datePaiement:"",notes:""},
  ],
  travaux:[
    {id:1,propId:1,date:"2024-02-15",type:"entretien",desc:"Révision chaudière",montant:280,prestataire:"Thermix SAS",statut:"terminé"},
    {id:2,propId:1,date:"2024-05-20",type:"travaux",desc:"Remplacement robinetterie",montant:650,prestataire:"Plomberie Martin",statut:"terminé"},
    {id:3,propId:2,date:"2024-07-01",type:"travaux",desc:"Peinture complète",montant:1200,prestataire:"À définir",statut:"planifié"},
  ],
  courriers:[
    {id:1,propId:1,date:"2024-07-10",type:"relance",titre:"1ère relance loyer juillet",destinataire:"Marie Dupont",statut:"envoyé",notes:"Envoi email + RAR"},
    {id:2,propId:1,date:"2024-07-25",type:"mise_en_demeure",titre:"Mise en demeure loyer juillet",destinataire:"Marie Dupont",statut:"envoyé",notes:"AR reçu le 28/07"},
    {id:3,propId:1,date:"2024-08-05",type:"commandement",titre:"Commandement de payer",destinataire:"Marie Dupont",statut:"en_cours",notes:"Huissier mandaté"},
  ],
  mails:[
    {id:1,propId:1,date:"2024-07-10",objet:"Retard paiement loyer juillet",de:"moi",a:"marie.dupont@email.fr",corps:"Madame,\n\nNous n'avons pas reçu le paiement du loyer de juillet.\n\nCordialement",tag:"loyer",lu:true,aiTriage:true},
    {id:2,propId:1,date:"2024-07-12",objet:"RE: Retard paiement loyer juillet",de:"marie.dupont@email.fr",a:"moi",corps:"Bonjour,\n\nJe vais régulariser cette semaine.\n\nMarie Dupont",tag:"loyer",lu:true,aiTriage:true},
    {id:3,propId:1,date:"2024-08-01",objet:"Fuite robinetterie cuisine",de:"marie.dupont@email.fr",a:"moi",corps:"Bonjour,\n\nIl y a une petite fuite sous l'évier depuis hier soir.\n\nMerci",tag:"travaux",lu:false,aiTriage:true},
  ],
};

// ── STATE ──
let state={
  nav:"dashboard",propId:null,tab:"loyers",modal:null,
  data:loadData()||JSON.parse(JSON.stringify(DEFAULT_DATA))
};

const SP={loué:{bg:"#d4edda",text:"#155724",dot:"#28a745",label:"Loué"},vacant:{bg:"#fff3cd",text:"#856404",dot:"#ffc107",label:"Vacant"},travaux:{bg:"#fdf2f2",text:"#c0392b",dot:"#dc3545",label:"Travaux"}};
const SL={payé:{bg:"#d4edda",text:"#155724",dot:"#28a745",label:"Payé"},attendu:{bg:"#e8effa",text:"#1a3a6a",dot:"#2563eb",label:"Attendu"},retard:{bg:"#fff3cd",text:"#856404",dot:"#ffc107",label:"En retard"},impayé:{bg:"#fdf2f2",text:"#c0392b",dot:"#dc3545",label:"Impayé"}};
const SC={planifié:{bg:"#e8effa",text:"#1a3a6a",dot:"#2563eb"},envoyé:{bg:"#d4edda",text:"#155724",dot:"#28a745"},en_cours:{bg:"#fff3cd",text:"#856404",dot:"#ffc107"},classé:{bg:"#f3e5f5",text:"#6a1b9a",dot:"#8e24aa"}};
const TT={entretien:{color:"#1a3a6a",bg:"#e8effa",label:"Entretien"},travaux:{color:"#c0392b",bg:"#fdf2f2",label:"Travaux"},urgence:{color:"#856404",bg:"#fff3cd",label:"Urgence"},syndic:{color:"#6a1b9a",bg:"#f3e5f5",label:"Syndic"}};
const TC={relance:"Relance",mise_en_demeure:"Mise en demeure",commandement:"Commandement de payer",congé:"Congé donné",autre:"Autre"};

function bdg(s,label){return`<span class="badge" style="background:${s.bg};color:${s.text}"><span style="width:5px;height:5px;border-radius:50%;background:${s.dot};flex-shrink:0;display:inline-block;margin-right:2px"></span>${esc(label)}</span>`;}
function chp(color,bg,label){return`<span class="chip" style="background:${bg};color:${color}">${esc(label)}</span>`;}
function lbl(text){return`<label style="display:block;font-size:.7rem;color:#8a7968;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.28rem">${text}</label>`;}

// ── RENDER PRINCIPAL ──
function render(){
  const d=state.data;
  const prop=d.properties.find(p=>p.id===state.propId);
  const loues=d.properties.filter(p=>p.statut==="loué");
  const rev=loues.reduce((s,p)=>s+p.loyer,0);
  const charges=loues.reduce((s,p)=>s+p.charges,0);
  const syndic=loues.reduce((s,p)=>s+(p.syndic?.cotisation||0),0);
  const imp=d.loyers.filter(l=>l.statut==="impayé").reduce((s,l)=>s+l.montant,0);
  const trCost=d.travaux.reduce((s,t)=>s+(+t.montant||0),0);
  const unread=d.mails.filter(m=>!m.lu).length;
  const alertCount=d.loyers.filter(l=>l.statut==="impayé"||l.statut==="retard").length;

  document.getElementById("backBtn").style.display=(state.nav==="detail"||state.nav==="more")?"block":"none";

  // Bottom nav
  const navItems=[["dashboard","🏠","Accueil",0],["biens","🏢","Biens",0],["loyers_g","💶","Loyers",alertCount],["travaux_g","🔧","Travaux",0],["more","⋯","Plus",unread]];
  document.getElementById("bottomnav").innerHTML=navItems.map(([v,icon,label,b])=>`
    <button class="navbtn ${state.nav===v?"on":""}" onclick="goNav('${v}')">
      <div style="position:relative;display:inline-block">
        <span class="ni">${icon}</span>
        ${b>0?`<span style="position:absolute;top:-3px;right:-6px;background:#e53935;color:#fff;font-size:.52rem;padding:1px 4px;border-radius:10px;min-width:14px;text-align:center;line-height:1.4">${b}</span>`:""}
      </div>
      <span>${label}</span>
    </button>`).join("");

  let html="";
  const main=document.getElementById("main");

  // ══ DASHBOARD ══
  if(state.nav==="dashboard"){
    const alerts=[];
    d.loyers.filter(l=>l.statut==="impayé").forEach(l=>{const p=d.properties.find(x=>x.id===l.propId);if(p)alerts.push({type:"danger",text:`Impayé ${moisLabel(l.mois)} — ${p.nom}`,propId:p.id,tab:"loyers"});});
    d.loyers.filter(l=>l.statut==="retard").forEach(l=>{const p=d.properties.find(x=>x.id===l.propId);if(p)alerts.push({type:"warn",text:`Retard ${moisLabel(l.mois)} — ${p.nom}`,propId:p.id,tab:"loyers"});});
    d.mails.filter(m=>!m.lu).forEach(m=>{const p=d.properties.find(x=>x.id===m.propId);if(p)alerts.push({type:"info",text:`Non lu : "${m.objet}"`,propId:p.id,tab:"mails"});});

    html+=`<div style="margin-bottom:1.1rem"><h1 style="font-size:1.25rem;font-weight:700;color:#1a3a2a;margin-bottom:.15rem">Bonjour 👋</h1><p style="color:#8a7968;font-size:.8rem">${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</p></div>`;
    html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem">`;
    [["💶","Revenus/mois",fmt(rev),"loyers bruts",false],["📈","Net estimé",fmt(rev-charges-syndic),"après charges",false],["🏢","Occupation",`${d.properties.length>0?Math.round(loues.length/d.properties.length*100):0}%`,`${loues.length} loués · ${d.properties.filter(p=>p.statut==="vacant").length} vacants`,false],["⚠️","Impayés",fmt(imp),"à recouvrer",imp>0]].forEach(([icon,label,value,sub,danger])=>{
      html+=`<div class="kpi" style="border-left:3px solid ${danger?"#c0392b":"#1a3a2a"}"><div style="font-size:1.1rem;margin-bottom:.3rem">${icon}</div><div style="font-size:.62rem;color:#8a7968;text-transform:uppercase;letter-spacing:.05em">${label}</div><div style="font-size:1.15rem;font-weight:700;color:${danger?"#c0392b":"#2d2820"};margin:.2rem 0 .1rem">${value}</div><div style="font-size:.65rem;color:#a89a88">${sub}</div></div>`;
    });
    html+=`</div>`;

    if(alerts.length>0){
      html+=`<div class="card" style="margin-bottom:1rem"><div class="sec-head"><h3 class="sec-title">⚡ Alertes</h3></div>`;
      alerts.forEach(a=>{html+=`<div class="row" onclick="goDetail(${a.propId},'${a.tab}')" style="cursor:pointer"><span style="width:7px;height:7px;border-radius:50%;background:${a.type==="danger"?"#e53935":a.type==="warn"?"#ff9800":"#1e88e5"};flex-shrink:0"></span><span style="font-size:.83rem;color:#2d2820;flex:1">${esc(a.text)}</span><span style="color:#a89a88">›</span></div>`;});
      html+=`</div>`;
    }

    html+=`<div class="card" style="margin-bottom:1rem"><div class="sec-head"><h3 class="sec-title">🏢 Mes biens</h3><button class="add-btn" onclick="openAddProp()">+ Ajouter</button></div>`;
    d.properties.forEach(p=>{
      const sc=SP[p.statut]||SP.vacant;
      const impC=d.loyers.filter(l=>l.propId===p.id&&(l.statut==="impayé"||l.statut==="retard")).length;
      html+=`<div class="row" onclick="goDetail(${p.id})" style="cursor:pointer"><span style="font-size:1.6rem">${p.image}</span><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:.88rem;color:#2d2820;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.nom)}</div><div style="font-size:.72rem;color:#8a7968">${p.type} · ${p.surface}m²${p.locataire?" · "+esc(p.locataire.nom):""}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">${bdg(sc,sc.label)}${impC>0?bdg({bg:"#fdf2f2",text:"#c0392b",dot:"#dc3545"},impC+" impayé"+(impC>1?"s":"")):""}
      </div></div>`;
    });
    html+=`</div>`;

    const withLoc=d.properties.filter(p=>p.locataire);
    if(withLoc.length>0){
      html+=`<div class="card"><div class="sec-head"><h3 class="sec-title">👤 Locataires</h3></div>`;
      withLoc.forEach(p=>{html+=`<div class="row" onclick="goDetail(${p.id})" style="cursor:pointer"><div style="width:34px;height:34px;border-radius:50%;background:#e8f4ed;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;color:#1a3a2a;flex-shrink:0">${p.locataire.nom[0]}</div><div style="flex:1"><div style="font-weight:600;font-size:.85rem;color:#2d2820">${esc(p.locataire.nom)}</div><div style="font-size:.72rem;color:#8a7968">${esc(p.nom)}</div></div><div style="text-align:right"><div style="font-weight:700;color:#1a3a2a;font-size:.85rem">${fmt(p.loyer)}</div><div style="font-size:.65rem;color:#a89a88">/mois</div></div></div>`;});
      html+=`</div>`;
    }
  }

  // ══ BIENS ══
  else if(state.nav==="biens"){
    html+=`<h1 style="font-size:1.2rem;font-weight:700;color:#1a3a2a;margin-bottom:1rem">${d.properties.length} bien${d.properties.length>1?"s":""}</h1>`;
    d.properties.forEach(p=>{
      const sc=SP[p.statut]||SP.vacant;
      const impC=d.loyers.filter(l=>l.propId===p.id&&(l.statut==="impayé"||l.statut==="retard")).length;
      const trC=d.travaux.filter(t=>t.propId===p.id).reduce((s,t)=>s+(+t.montant||0),0);
      const typeCol={Appartement:"#e8f4fd",Studio:"#fef9e7",Maison:"#e8f8f5",Commerce:"#fdf2f8",Parking:"#f2f3f4"}[p.type]||"#f5f2ed";
      html+=`<div class="prop-card" onclick="goDetail(${p.id})">
        <div style="background:${typeCol};padding:1.1rem 1.1rem .8rem;display:flex;justify-content:space-between;align-items:flex-start">
          <div style="display:flex;align-items:center;gap:.65rem"><span style="font-size:2rem">${p.image}</span><div><div style="font-weight:700;font-size:.95rem;color:#2d2820">${esc(p.nom)}</div><div style="font-size:.72rem;color:#8a7968">${p.type} · ${p.surface}m²</div></div></div>
          ${bdg(sc,sc.label)}
        </div>
        <div style="padding:.85rem 1.1rem">
          <div style="font-size:.75rem;color:#8a7968;margin-bottom:.7rem">📍 ${esc(p.adresse)}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.6rem">
            <div style="background:#f5f2ed;border-radius:.55rem;padding:.55rem .7rem"><div style="font-size:.6rem;color:#a89a88;text-transform:uppercase;letter-spacing:.05em">Loyer CC</div><div style="font-weight:700;color:#1a3a2a;font-size:.9rem">${fmt(p.loyer+p.charges)}</div></div>
            <div style="background:#f5f2ed;border-radius:.55rem;padding:.55rem .7rem"><div style="font-size:.6rem;color:#a89a88;text-transform:uppercase;letter-spacing:.05em">Travaux</div><div style="font-weight:700;color:#2d2820;font-size:.9rem">${fmt(trC)}</div></div>
          </div>
          <div style="display:flex;gap:.4rem;flex-wrap:wrap">
            ${p.locataire?chp("#1a3a2a","#e8f4ed","👤 "+p.locataire.nom):""}
            ${impC>0?chp("#c0392b","#fdf2f2","⚠️ "+impC+" impayé"+(impC>1?"s":"")):""}
          </div>
        </div>
      </div>`;
    });
  }

  // ══ DETAIL ══
  else if(state.nav==="detail"&&prop){
    const pL=d.loyers.filter(l=>l.propId===state.propId).sort((a,b)=>b.mois.localeCompare(a.mois));
    const pT=d.travaux.filter(t=>t.propId===state.propId).sort((a,b)=>b.date.localeCompare(a.date));
    const pC=d.courriers.filter(c=>c.propId===state.propId).sort((a,b)=>b.date.localeCompare(a.date));
    const pM=d.mails.filter(m=>m.propId===state.propId).sort((a,b)=>b.date.localeCompare(a.date));
    const impT=pL.filter(l=>l.statut==="impayé"||l.statut==="retard").reduce((s,l)=>s+l.montant,0);

  if(!state.modal)return;
  const m=state.modal;
  let html="";

  if(m.type==="viewMail"){
    const mail=m.payload;
    html=`<div class="drag"></div><h2 style="font-size:1rem;font-weight:700;color:#1a3a2a;margin-bottom:1.1rem">${esc(mail.objet)}</h2>
    <div style="background:#faf9f7;border-radius:.65rem;padding:1rem;margin-bottom:.85rem;font-size:.82rem;color:#8a7968">
      <div style="margin-bottom:.3rem"><b style="color:#5a4e42">De :</b> ${mail.de==="moi"?"Moi":esc(mail.de)}</div>
      <div style="margin-bottom:.3rem"><b style="color:#5a4e42">À :</b> ${esc(mail.a)}</div>
      <div style="margin-bottom:.3rem"><b style="color:#5a4e42">Date :</b> ${fmtDate(mail.date)}</div>
      <div style="display:flex;gap:.4rem;margin-top:.4rem;flex-wrap:wrap">${mail.tag?chp("#1a3a6a","#e8effa",mail.tag):""}${mail.aiTriage?chp("#1a3a2a","#e8f4ed","🤖 Importé par IA"):""}</div>
    </div>
    <div style="font-size:.85rem;color:#2d2820;line-height:1.75;white-space:pre-wrap;background:#fff;border-radius:.65rem;padding:.85rem;border:1px solid #ddd8cf">${esc(mail.corps)}</div>
    <div style="margin-top:1rem"><button class="btn-secondary" onclick="closeModal()">Fermer</button></div>`;
  }

  else if(m.type==="confirmDelete"){
    html=`<div class="drag"></div><h2 style="font-size:1rem;font-weight:700;color:#1a3a2a;margin-bottom:1rem">Supprimer ce bien ?</h2>
    <p style="color:#5a4e42;font-size:.88rem;margin-bottom:1.25rem;line-height:1.6">Cette action est irréversible. <strong>${esc(m.payload.nom)}</strong> sera supprimé définitivement.</p>
    <div style="display:flex;gap:.65rem"><button class="btn-secondary" onclick="closeModal()">Annuler</button><button style="flex:1;background:#c0392b;color:#fff;padding:.7rem;border-radius:.75rem;font-size:.88rem;cursor:pointer;border:none" onclick="deleteProp(${m.payload.id})">Supprimer</button></div>`;
  }

  else if(m.type==="addLoyer"){
    html=`<div class="drag"></div><h2 style="font-size:1rem;font-weight:700;color:#1a3a2a;margin-bottom:1rem">Enregistrer un loyer</h2>
    <div style="display:flex;flex-direction:column;gap:.75rem">
      <div>${lbl("Mois *")}<input class="input" type="month" id="f_mois"></div>
      <div>${lbl("Montant (€) *")}<input class="input" type="number" id="f_montant" placeholder="0"></div>
      <div>${lbl("Statut")}<select class="input" id="f_statut"><option value="payé">Payé</option><option value="attendu">Attendu</option><option value="retard">En retard</option><option value="impayé">Impayé</option></select></div>
      <div>${lbl("Date de paiement")}<input class="input" type="date" id="f_date"></div>
      <div>${lbl("Notes")}<textarea class="input" id="f_notes" rows="2"></textarea></div>
    </div>
    <div style="display:flex;gap:.65rem;margin-top:1.25rem"><button class="btn-secondary" onclick="closeModal()">Annuler</button><button class="btn-primary" onclick="saveLoyer()" style="flex:2">Enregistrer</button></div>`;
  }

  else if(m.type==="addTravaux"){
    html=`<div class="drag"></div><h2 style="font-size:1rem;font-weight:700;color:#1a3a2a;margin-bottom:1rem">Ajouter une intervention</h2>
    <div style="display:flex;flex-direction:column;gap:.75rem">
      <div>${lbl("Description *")}<input class="input" id="f_desc" placeholder="Ex: Révision chaudière"></div>
      <div>${lbl("Catégorie")}<select class="input" id="f_type"><option value="entretien">Entretien</option><option value="travaux">Travaux</option><option value="urgence">Urgence</option><option value="syndic">Syndic</option></select></div>
      <div>${lbl("Coût (€) *")}<input class="input" type="number" id="f_montant" placeholder="0"></div>
      <div>${lbl("Prestataire")}<input class="input" id="f_presta" placeholder="Nom du prestataire"></div>
      <div>${lbl("Date")}<input class="input" type="date" id="f_date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div>${lbl("Statut")}<select class="input" id="f_statut"><option value="planifié">Planifié</option><option value="en_cours">En cours</option><option value="terminé">Terminé</option></select></div>
    </div>
    <div style="display:flex;gap:.65rem;margin-top:1.25rem"><button class="btn-secondary" onclick="closeModal()">Annuler</button><button class="btn-primary" onclick="saveTravaux()" style="flex:2">Enregistrer</button></div>`;
  }

  else if(m.type==="addCourrier"){
    html=`<div class="drag"></div><h2 style="font-size:1rem;font-weight:700;color:#1a3a2a;margin-bottom:1rem">Nouveau courrier / procédure</h2>
    <div style="display:flex;flex-direction:column;gap:.75rem">
      <div>${lbl("Titre *")}<input class="input" id="f_titre" placeholder="Ex: Relance loyer juillet"></div>
      <div>${lbl("Type")}<select class="input" id="f_type"><option value="relance">Relance</option><option value="mise_en_demeure">Mise en demeure</option><option value="commandement">Commandement de payer</option><option value="congé">Congé donné</option><option value="autre">Autre</option></select></div>
      <div>${lbl("Destinataire *")}<input class="input" id="f_dest" placeholder="Nom du destinataire"></div>
      <div>${lbl("Statut")}<select class="input" id="f_statut"><option value="planifié">Planifié</option><option value="envoyé">Envoyé</option><option value="en_cours">En cours</option><option value="classé">Classé</option></select></div>
      <div>${lbl("Notes / Suivi")}<textarea class="input" id="f_notes" rows="2"></textarea></div>
    </div>
    <div style="display:flex;gap:.65rem;margin-top:1.25rem"><button class="btn-secondary" onclick="closeModal()">Annuler</button><button class="btn-primary" onclick="saveCourrier()" style="flex:2">Enregistrer</button></div>`;
  }

  else if(m.type==="addMail"){
    html=`<div class="drag"></div><h2 style="font-size:1rem;font-weight:700;color:#1a3a2a;margin-bottom:1rem">Rédiger un mail</h2>
    <div style="display:flex;flex-direction:column;gap:.75rem">
      <div>${lbl("Objet *")}<input class="input" id="f_objet" placeholder="Objet du mail"></div>
      <div>${lbl("Destinataire *")}<input class="input" id="f_a" placeholder="email@exemple.fr"></div>
      <div>${lbl("Catégorie")}<select class="input" id="f_tag"><option value="loyer">Loyer</option><option value="travaux">Travaux</option><option value="syndic">Syndic</option><option value="procédure">Procédure</option><option value="autre">Autre</option></select></div>
      <div>${lbl("Message *")}<textarea class="input" id="f_corps" rows="5" placeholder="Votre message..."></textarea></div>
    </div>
    <div style="display:flex;gap:.65rem;margin-top:1.25rem"><button class="btn-secondary" onclick="closeModal()">Annuler</button><button class="btn-primary" onclick="saveMail()" style="flex:2">Envoyer</button></div>`;
  }

  else if(m.type==="addProp"||m.type==="editProp"){
    const p=m.payload||{};
    const isEdit=!!p.id;
    const loc=p.locataire||{};
    const syn=p.syndic||{};
    html=`<div class="drag"></div><h2 style="font-size:1rem;font-weight:700;color:#1a3a2a;margin-bottom:1rem">${isEdit?"Modifier le bien":"Nouveau bien"}</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
      <div style="grid-column:span 2">${lbl("Nom *")}<input class="input" id="f_nom" value="${esc(p.nom||"")}" placeholder="Ex: Appt Centre-Ville"></div>
      <div style="grid-column:span 2">${lbl("Adresse *")}<input class="input" id="f_adresse" value="${esc(p.adresse||"")}" placeholder="Rue, CP, Ville"></div>
      <div>${lbl("Type")}<select class="input" id="f_type"><option${!p.type||p.type==="Appartement"?" selected":""}>Appartement</option><option${p.type==="Studio"?" selected":""}>Studio</option><option${p.type==="Maison"?" selected":""}>Maison</option><option${p.type==="Commerce"?" selected":""}>Commerce</option><option${p.type==="Parking"?" selected":""}>Parking</option></select></div>
      <div>${lbl("Surface (m²)")}<input class="input" type="number" id="f_surface" value="${p.surface||""}"></div>
      <div>${lbl("Loyer HC (€/mois)")}<input class="input" type="number" id="f_loyer" value="${p.loyer||""}"></div>
      <div>${lbl("Charges (€/mois)")}<input class="input" type="number" id="f_charges" value="${p.charges||""}"></div>
      <div>${lbl("Caution (€)")}<input class="input" type="number" id="f_caution" value="${p.caution||""}"></div>
      <div>${lbl("Statut")}<select class="input" id="f_statut"><option value="loué"${p.statut==="loué"?" selected":""}>Loué</option><option value="vacant"${!p.statut||p.statut==="vacant"?" selected":""}>Vacant</option><option value="travaux"${p.statut==="travaux"?" selected":""}>Travaux</option></select></div>
      <div style="grid-column:span 2">${lbl("Notes")}<textarea class="input" id="f_notes" rows="2">${esc(p.notes||"")}</textarea></div>
    </div>

    <button class="sec-toggle" onclick="toggleSection('sec_loc')">
      <span id="sec_loc_arrow">${p.locataire?"▼":"►"}</span> 👤 Locataire
    </button>
    <div id="sec_loc" style="display:${p.locataire?"block":"none"}">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.5rem">
        <div style="grid-column:span 2">${lbl("Nom complet")}<input class="input" id="f_loc_nom" value="${esc(loc.nom||"")}" placeholder="Prénom Nom"></div>
        <div>${lbl("Email")}<input class="input" type="email" id="f_loc_email" value="${esc(loc.email||"")}" placeholder="email@..."></div>
        <div>${lbl("Téléphone")}<input class="input" id="f_loc_tel" value="${esc(loc.tel||"")}" placeholder="06..."></div>
        <div style="grid-column:span 2">${lbl("Date d'entrée")}<input class="input" type="date" id="f_loc_date" value="${loc.dateEntree||""}"></div>
      </div>
    </div>

    <button class="sec-toggle" onclick="toggleSection('sec_syn')">
      <span id="sec_syn_arrow">${p.syndic?"▼":"►"}</span> 🏢 Syndic / Gestionnaire
    </button>
    <div id="sec_syn" style="display:${p.syndic?"block":"none"}">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.5rem">
        <div style="grid-column:span 2">${lbl("Nom du syndic")}<input class="input" id="f_syn_nom" value="${esc(syn.nom||"")}" placeholder="Nom du syndic"></div>
        <div>${lbl("Email contact")}<input class="input" id="f_syn_contact" value="${esc(syn.contact||"")}" placeholder="email@..."></div>
        <div>${lbl("Téléphone")}<input class="input" id="f_syn_tel" value="${esc(syn.tel||"")}" placeholder="01..."></div>
        <div style="grid-column:span 2">${lbl("Cotisation (€/mois)")}<input class="input" type="number" id="f_syn_cotisation" value="${syn.cotisation||""}"></div>
      </div>
    </div>

    <div style="display:flex;gap:.65rem;margin-top:1.25rem">
      <button class="btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn-primary" onclick="saveProp(${isEdit?p.id:0})" style="flex:2">${isEdit?"Enregistrer":"Créer le bien"}</button>
    </div>`;
  }

  else if(m.type==="aiTriage"){
    html=`<div class="drag"></div><h2 style="font-size:1rem;font-weight:700;color:#1a3a2a;margin-bottom:1rem">🤖 Triage IA — Boîte mail</h2>
    <p style="font-size:.85rem;color:#5a4e42;line-height:1.6;margin-bottom:1rem">L'IA analyse votre boîte mail et importe automatiquement les emails immobiliers classés par bien.</p>
    <div style="background:#fffdf0;border:1px solid rgba(184,147,10,.3);border-radius:.65rem;padding:.85rem;margin-bottom:1rem;font-size:.78rem;color:#b8930a">⚠️ Mode démo — voir la documentation technique pour la connexion réelle à Gmail/Outlook.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1rem">
      ${[["gmail","📧 Gmail"],["outlook","📬 Outlook"],["imap","🖥️ IMAP"],["yahoo","📮 Yahoo"]].map(([v,l])=>`<button onclick="startAITriage('${v}')" style="padding:.75rem;border-radius:.7rem;border:2px solid #ddd8cf;background:#faf9f7;font-size:.85rem;color:#5a4e42;cursor:pointer;font-family:Georgia,serif">${l}</button>`).join("")}
    </div>
    <div style="display:flex;gap:.65rem"><button class="btn-secondary" onclick="closeModal()">Annuler</button></div>`;
  }

  const overlay=document.createElement("div");
  overlay.className="overlay";
  overlay.id="modalOverlay";
  overlay.onclick=function(e){if(e.target===this)closeModal();};
  const sheet=document.createElement("div");
  sheet.className="sheet";
  sheet.innerHTML=html;
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);
}

// ── ACTIONS ──
function goNav(v){state.nav=v;if(v!=="detail"&&v!=="more")state.propId=null;render();}
function goDetail(id,t){state.propId=id;state.tab=t||"loyers";state.nav="detail";render();}
function setTab(t){state.tab=t;render();}
function openModal(t){state.modal={type:t};renderModal();}
function closeModal(){state.modal=null;renderModal();}
function openAddProp(){state.modal={type:"addProp",payload:{}};renderModal();}
function openEditProp(id,section){
  const p=state.data.properties.find(x=>x.id===id);
  state.modal={type:"editProp",payload:p};
  renderModal();
  if(section==="loc"){setTimeout(()=>toggleSection("sec_loc"),100);}
  if(section==="syn"){setTimeout(()=>toggleSection("sec_syn"),100);}
}
function openAddTravaux(pid){state.propId=pid;state.modal={type:"addTravaux"};renderModal();}
function openAddCourrier(pid){state.propId=pid;state.modal={type:"addCourrier"};renderModal();}
function openAddMail(pid){state.propId=pid;state.modal={type:"addMail"};renderModal();}

function toggleSection(id){
  const el=document.getElementById(id);
  const arrow=document.getElementById(id+"_arrow");
  if(!el)return;
  const open=el.style.display==="none";
  el.style.display=open?"block":"none";
  if(arrow)arrow.textContent=open?"▼":"►";
}

function viewMail(id){
  const m=state.data.mails.find(x=>x.id===id);
  if(!m)return;
  state.data.mails=state.data.mails.map(x=>x.id===id?{...x,lu:true}:x);
  saveData();
  state.modal={type:"viewMail",payload:{...m,lu:true}};
  renderModal();
}

function confirmDelete(id){
  const p=state.data.properties.find(x=>x.id===id);
  if(p){state.modal={type:"confirmDelete",payload:p};renderModal();}
}

function deleteProp(id){
  state.data.properties=state.data.properties.filter(p=>p.id!==id);
  state.data.loyers=state.data.loyers.filter(l=>l.propId!==id);
  state.data.travaux=state.data.travaux.filter(t=>t.propId!==id);
  state.data.courriers=state.data.courriers.filter(c=>c.propId!==id);
  state.data.mails=state.data.mails.filter(m=>m.propId!==id);
  saveData();closeModal();state.nav="biens";state.propId=null;render();
}

function changeStatut(s){
  state.data.properties=state.data.properties.map(p=>p.id===state.propId?{...p,statut:s}:p);
  saveData();render();
}

function updateLoyerStatut(id,statut){
  state.data.loyers=state.data.loyers.map(l=>l.id===id?{...l,statut,datePaiement:statut==="payé"?new Date().toISOString().slice(0,10):l.datePaiement}:l);
  saveData();render();
}

function updateCourrierStatut(id,statut){
  state.data.courriers=state.data.courriers.map(c=>c.id===id?{...c,statut}:c);
  saveData();render();
}

function saveLoyer(){
  const mois=gv("f_mois");const montant=gv("f_montant");
  if(!mois||!montant)return alert("Veuillez remplir les champs obligatoires.");
  state.data.loyers.push({id:Date.now(),propId:state.propId,mois,montant:+montant,statut:gv("f_statut")||"payé",datePaiement:gv("f_date"),notes:gv("f_notes")});
  saveData();closeModal();render();
}

function saveTravaux(){
  const desc=gv("f_desc");const montant=gv("f_montant");
  if(!desc||!montant)return alert("Veuillez remplir les champs obligatoires.");
  state.data.travaux.push({id:Date.now(),propId:state.propId,desc,type:gv("f_type")||"entretien",montant:+montant,prestataire:gv("f_presta"),date:gv("f_date")||new Date().toISOString().slice(0,10),statut:gv("f_statut")||"terminé"});
  saveData();closeModal();render();
}

function saveCourrier(){
  const titre=gv("f_titre");const dest=gv("f_dest");
  if(!titre||!dest)return alert("Veuillez remplir les champs obligatoires.");
  state.data.courriers.push({id:Date.now(),propId:state.propId,titre,type:gv("f_type")||"relance",destinataire:dest,statut:gv("f_statut")||"envoyé",notes:gv("f_notes"),date:new Date().toISOString().slice(0,10)});
  saveData();closeModal();render();
}

function saveMail(){
  const objet=gv("f_objet");const a=gv("f_a");const corps=gv("f_corps");
  if(!objet||!a||!corps)return alert("Veuillez remplir les champs obligatoires.");
  state.data.mails.push({id:Date.now(),propId:state.propId,objet,a,corps,de:"moi",date:new Date().toISOString().slice(0,10),tag:gv("f_tag")||"autre",lu:true,aiTriage:false});
  saveData();closeModal();render();
}

function saveProp(editId){
  const nom=gv("f_nom");const adresse=gv("f_adresse");
  if(!nom||!adresse)return alert("Veuillez remplir le nom et l'adresse.");

  // Locataire
  const locNom=gv("f_loc_nom");
  const loc=locNom?{nom:locNom,email:gv("f_loc_email"),tel:gv("f_loc_tel"),dateEntree:gv("f_loc_date")}:null;

  // Syndic
  const synNom=gv("f_syn_nom");
  const syn=synNom?{nom:synNom,contact:gv("f_syn_contact"),tel:gv("f_syn_tel"),cotisation:+gv("f_syn_cotisation")||0}:null;

  const p={
    id:editId||Date.now(),nom,adresse,
    type:gv("f_type")||"Appartement",
    surface:+gv("f_surface")||0,
    loyer:+gv("f_loyer")||0,
    charges:+gv("f_charges")||0,
    caution:+gv("f_caution")||0,
    statut:gv("f_statut")||"vacant",
    notes:gv("f_notes"),
    image:editId?state.data.properties.find(x=>x.id===editId)?.image||"🏠":"🏠",
    locataire:loc,syndic:syn
  };

  if(editId){state.data.properties=state.data.properties.map(x=>x.id===editId?p:x);}
  else{state.data.properties.push(p);}
  saveData();closeModal();
  if(editId&&state.nav==="detail"){state.propId=editId;}
  render();
}

function startAITriage(src){
  closeModal();
  const propId=state.data.properties.length>0?state.data.properties[0].id:null;
  const now=new Date().toISOString().slice(0,10);
  const fakeEmails=[
    {id:Date.now(),propId,date:now,objet:"Question sur les charges — "+src,de:"locataire@email.fr",a:"moi",corps:"Bonjour,\n\nJe souhaitais avoir des précisions sur le montant des charges ce mois-ci.\n\nCordialement",tag:"loyer",lu:false,aiTriage:true},
    {id:Date.now()+1,propId,date:now,objet:"Convocation Assemblée Générale",de:"syndic@immobilier.fr",a:"moi",corps:"Madame, Monsieur,\n\nVous êtes convoqué à l'assemblée générale annuelle le 15 novembre.\n\nLe Syndic",tag:"syndic",lu:false,aiTriage:true},
    {id:Date.now()+2,propId,date:now,objet:"Devis travaux plomberie",de:"plombier@gmail.com",a:"moi",corps:"Bonjour,\n\nSuite à votre demande, je vous adresse le devis pour la réparation.\n\nCordialement",tag:"travaux",lu:false,aiTriage:true},
  ];
  fakeEmails.forEach(m=>state.data.mails.push(m));
  saveData();
  alert(`✅ ${fakeEmails.length} emails importés par l'IA !`);
  render();
}

function resetData(){
  if(confirm("Réinitialiser toutes les données ? Cette action est irréversible.")){
    localStorage.removeItem(STORAGE_KEY);
    state.data=JSON.parse(JSON.stringify(DEFAULT_DATA));
    saveData();render();
  }
}

// ── EVENT LISTENERS ──
document.getElementById("backBtn").addEventListener("click",()=>{
  if(state.nav==="detail"){state.nav="biens";state.propId=null;}
  else{state.nav="dashboard";}
  render();
});
document.getElementById("aiBtn").addEventListener("click",()=>{state.modal={type:"aiTriage"};renderModal();});
document.getElementById("addPropBtn").addEventListener("click",()=>openAddProp());

render();
</script>
</body>
</html>
