<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#1a3a2a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Solidor Immo"/>
<title>Solidor Immo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:#f5f2ed;min-height:100vh}
button{cursor:pointer;border:none;font-family:inherit}
input,select,textarea{font-family:inherit;outline:none}
#app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh}
.hdr{background:#1a3a2a;color:#fff;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 1rem;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hbtn{background:rgba(255,255,255,.18);color:#fff;border-radius:.6rem;padding:.35rem .7rem;font-size:.75rem;cursor:pointer}
.main{flex:1;padding:1rem;padding-bottom:5.5rem;overflow-y:auto}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;background:#fff;border-top:1px solid #ddd;display:flex;padding:.35rem .25rem .5rem;z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
.nb{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.4rem .15rem;background:none;color:#8a7968;font-size:.55rem;flex:1;min-width:0}
.nb.on{color:#1a3a2a}
.nb .ic{font-size:1.2rem;line-height:1}
.card{background:#fff;border-radius:1rem;box-shadow:0 2px 12px rgba(0,0,0,.07);padding:1rem;margin-bottom:1rem}
.row{display:flex;align-items:center;gap:.65rem;padding:.7rem .85rem;border-bottom:1px solid #f5f2ed}
.row:last-child{border-bottom:none}
.row:active{background:#faf9f7}
.tab{padding:.4rem .75rem;border-radius:.55rem;font-size:.75rem;background:none;color:#8a7968;white-space:nowrap;cursor:pointer}
.tab.on{background:#1a3a2a;color:#fff;font-weight:600}
.inp{width:100%;padding:.6rem .85rem;border:1.5px solid #ddd;border-radius:.6rem;background:#faf9f7;font-size:.85rem;color:#2d2820}
.inp:focus{border-color:#1a3a2a;background:#fff}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.sht{background:#fff;border-radius:1.25rem 1.25rem 0 0;padding:1.25rem 1.25rem 2.5rem;width:100%;max-width:600px;max-height:92vh;overflow-y:auto}
.drag{width:36px;height:4px;border-radius:2px;background:#ddd;margin:0 auto .9rem}
.lbl{display:block;font-size:.7rem;color:#8a7968;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem}
.bp{background:#1a3a2a;color:#fff;padding:.7rem;border-radius:.75rem;font-size:.88rem;font-weight:600;width:100%;cursor:pointer}
.bs{background:#ede8e0;color:#5a4e42;padding:.7rem;border-radius:.75rem;font-size:.88rem;width:100%;cursor:pointer}
.bdg{display:inline-flex;align-items:center;gap:3px;font-size:.68rem;padding:.22rem .6rem;border-radius:2rem;font-weight:600;white-space:nowrap}
.chp{display:inline-block;font-size:.68rem;padding:.18rem .55rem;border-radius:2rem;font-weight:600}
.kpi{background:#fff;border-radius:1rem;padding:.85rem;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem}
.st{font-size:.9rem;font-weight:700;color:#1a3a2a;margin:0}
.ab{background:#1a3a2a;color:#fff;border-radius:.55rem;padding:.35rem .75rem;font-size:.75rem;cursor:pointer}
.mt{font-size:.78rem;font-weight:700;color:#1a3a2a;text-transform:uppercase;letter-spacing:.05em;padding-top:.85rem;margin:.75rem 0 .5rem;border-top:1px solid #ddd;width:100%;text-align:left;background:none;display:flex;gap:.5rem;align-items:center}
.sv{position:fixed;top:60px;right:12px;background:#1a3a2a;color:#fff;font-size:.72rem;padding:.3rem .75rem;border-radius:2rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.sv.on{opacity:1}
.empty{text-align:center;padding:1.5rem;color:#a89a88;font-size:.85rem}
.cal{width:100%;border-collapse:collapse;font-size:.78rem}
.cal th{background:#1a3a2a;color:#fff;padding:.4rem .2rem;text-align:center;font-weight:600}
.cal td{border:1px solid #e8e3da;padding:.3rem .2rem;text-align:center;min-height:32px;vertical-align:top;cursor:pointer;font-size:.7rem}
.cal td:active{background:#f0f7f4}
.res{border-radius:3px;padding:1px 3px;font-size:.62rem;font-weight:600;margin-top:1px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-sel{background:#e8f4ed!important;border:2px solid #1a3a2a!important}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div style="display:flex;align-items:center;gap:.55rem">
      <button id="backBtn" class="hbtn" style="display:none">&#8592;</button>
      <span style="font-size:1.1rem">&#128273;</span>
      <span style="font-weight:700;font-size:.92rem">Solidor Immo</span>
    </div>
    <div style="display:flex;gap:.4rem">
      <button class="hbtn" id="aiBtn" style="font-size:.72rem">&#129302; IA</button>
      <button class="hbtn" id="addBtn" style="font-size:.72rem">+ Bien</button>
    </div>
  </div>
  <div class="sv" id="sv">&#10003; Sauvegarde</div>
  <div class="main" id="main"></div>
  <nav class="bnav" id="bnav"></nav>
</div>
<script>
var SK="solidor_v4";
var fmt=function(n){return new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);};
var fd=function(d){return d?new Date(d).toLocaleDateString("fr-FR"):"--";};
var ml=function(m){if(!m)return"--";var p=m.split("-");return new Date(p[0],p[1]-1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"});};
var esc=function(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");};
var gv=function(id){var el=document.getElementById(id);return el?el.value:"";};

function saveD(){
  try{
    localStorage.setItem(SK,JSON.stringify(S.data));
    var el=document.getElementById("sv");
    if(el){el.classList.add("on");setTimeout(function(){el.classList.remove("on");},1500);}
  }catch(e){}
}
function loadD(){
  try{var s=localStorage.getItem(SK);if(s)return JSON.parse(s);}catch(e){}
  return null;
}

var MOIS=["Jan","Fev","Mar","Avr","Mai","Jun","Jul","Aou","Sep","Oct","Nov","Dec"];
var MOISLONG=["Janvier","Fevrier","Mars","Avril","Mai","Juin","Juillet","Aout","Septembre","Octobre","Novembre","Decembre"];

var DEF={
  props:[
    {id:1,nom:"Appt Haussmannien",adr:"12 Rue de Rivoli, Paris",type:"Appartement",surf:78,img:"HH",stat:"loue",loyer:1850,charges:220,caution:3700,notes:"Parquet ancien.",
     loc:{nom:"Marie Dupont",email:"marie@email.fr",tel:"06 12 34 56 78",date:"2023-03-01"},
     syn:{nom:"Syndic Rivoli",contact:"syndic@rivoli.fr",tel:"01 40 00 11 22",cotis:180}},
    {id:2,nom:"Studio Montmartre",adr:"7 Rue Lepic, Paris",type:"Studio",surf:28,img:"MA",stat:"vacant",loyer:890,charges:80,caution:0,notes:"Travaux peinture.",loc:null,syn:null}
  ],
  loyers:[
    {id:1,pid:1,mois:"2024-05",mt:2070,stat:"paye",dp:"2024-05-03",notes:""},
    {id:2,pid:1,mois:"2024-06",mt:2070,stat:"paye",dp:"2024-06-02",notes:""},
    {id:3,pid:1,mois:"2024-07",mt:2070,stat:"retard",dp:"",notes:"Relance 10/07"},
    {id:4,pid:1,mois:"2024-08",mt:2070,stat:"impaye",dp:"",notes:""}
  ],
  travaux:[
    {id:1,pid:1,date:"2024-02-15",type:"entretien",desc:"Revision chaudiere",mt:280,prest:"Thermix",stat:"termine"},
    {id:2,pid:1,date:"2024-05-20",type:"travaux",desc:"Remplacement robinetterie",mt:650,prest:"Plomberie Martin",stat:"termine"},
    {id:3,pid:2,date:"2024-07-01",type:"travaux",desc:"Peinture complete",mt:1200,prest:"A definir",stat:"planifie"}
  ],
  courriers:[
    {id:1,pid:1,date:"2024-07-10",type:"relance",titre:"1ere relance loyer juillet",dest:"Marie Dupont",stat:"envoye",notes:"Email + RAR"},
    {id:2,pid:1,date:"2024-07-25",type:"miseendemeure",titre:"Mise en demeure juillet",dest:"Marie Dupont",stat:"envoye",notes:"AR recu 28/07"},
    {id:3,pid:1,date:"2024-08-05",type:"commandement",titre:"Commandement de payer",dest:"Marie Dupont",stat:"encours",notes:"Huissier mandate"}
  ],
  mails:[
    {id:1,pid:1,date:"2024-07-10",obj:"Retard loyer juillet",de:"moi",a:"marie@email.fr",corps:"Nous n avons pas recu le loyer.\n\nCordialement",tag:"loyer",lu:true,ia:true},
    {id:2,pid:1,date:"2024-07-12",obj:"RE: Retard loyer juillet",de:"marie@email.fr",a:"moi",corps:"Je vais regulariser.\n\nMarie",tag:"loyer",lu:true,ia:true},
    {id:3,pid:1,date:"2024-08-01",obj:"Fuite robinetterie",de:"marie@email.fr",a:"moi",corps:"Il y a une fuite sous l evier.\n\nMerci",tag:"travaux",lu:false,ia:true}
  ],
  charges:[],
  saisonnier:{
    props:[
      {id:101,nom:"Villa Bord de Mer",adr:"12 Av. de la Plage, Nice",surf:95,img:"VL",prix_nuit:180,notes:"Piscine, vue mer"}
    ],
    reservations:[
      {id:201,pid:101,debut:"2024-07-05",fin:"2024-07-12",nom:"Famille Martin",couleur:"#2196F3",prix:1260,source:"airbnb"},
      {id:202,pid:101,debut:"2024-07-20",fin:"2024-07-27",nom:"Dupont M.",couleur:"#4CAF50",prix:1260,source:"booking"},
      {id:203,pid:101,debut:"2024-08-03",fin:"2024-08-10",nom:"Smith J.",couleur:"#FF9800",prix:1260,source:"manuel"}
    ],
    charges:[
      {id:301,pid:101,annee:2024,eau:800,electricite:1200,menage:2400,copro:600,divers:[{desc:"Internet",mt:240},{desc:"Assurance",mt:350}]}
    ]
  }
};

var S={nav:"db",pid:null,tab:"loyers",modal:null,spid:null,scal:{annee:new Date().getFullYear(),mois:new Date().getMonth()},data:loadD()||JSON.parse(JSON.stringify(DEF))};
if(!S.data.charges)S.data.charges=[];
if(!S.data.saisonnier)S.data.saisonnier={props:[],reservations:[],charges:[]};
if(!S.data.saisonnier.charges)S.data.saisonnier.charges=[];

var SPS={loue:{bg:"#d4edda",tx:"#155724",dot:"#28a745",lb:"Loue"},vacant:{bg:"#fff3cd",tx:"#856404",dot:"#ffc107",lb:"Vacant"},travaux:{bg:"#fdf2f2",tx:"#c0392b",dot:"#dc3545",lb:"Travaux"}};
var SLS={paye:{bg:"#d4edda",tx:"#155724",dot:"#28a745",lb:"Paye"},attendu:{bg:"#e8effa",tx:"#1a3a6a",dot:"#2563eb",lb:"Attendu"},retard:{bg:"#fff3cd",tx:"#856404",dot:"#ffc107",lb:"Retard"},impaye:{bg:"#fdf2f2",tx:"#c0392b",dot:"#dc3545",lb:"Impaye"}};
var SCS={planifie:{bg:"#e8effa",tx:"#1a3a6a",dot:"#2563eb"},envoye:{bg:"#d4edda",tx:"#155724",dot:"#28a745"},encours:{bg:"#fff3cd",tx:"#856404",dot:"#ffc107"},classe:{bg:"#f3e5f5",tx:"#6a1b9a",dot:"#8e24aa"}};
var TTY={entretien:{c:"#1a3a6a",bg:"#e8effa",lb:"Entretien"},travaux:{c:"#c0392b",bg:"#fdf2f2",lb:"Travaux"},urgence:{c:"#856404",bg:"#fff3cd",lb:"Urgence"},syndic:{c:"#6a1b9a",bg:"#f3e5f5",lb:"Syndic"}};
var TCR={relance:"Relance",miseendemeure:"Mise en demeure",commandement:"Commandement",conge:"Conge",autre:"Autre"};
var COULEURS=["#2196F3","#4CAF50","#FF9800","#E91E63","#9C27B0","#00BCD4","#FF5722","#607D8B"];

function bdg(s,lb){return'<span class="bdg" style="background:'+s.bg+';color:'+s.tx+'"><span style="width:5px;height:5px;border-radius:50%;background:'+s.dot+';display:inline-block;margin-right:2px"></span>'+esc(lb)+'</span>';}
function chp(c,bg,lb){return'<span class="chp" style="background:'+bg+';color:'+c+'">'+esc(lb)+'</span>';}
function getImg(p){var m={"HH":"&#127963;","MA":"&#127968;","VL":"&#127968;","AP":"&#127968;"};return m[p.img]||"&#127968;";}

// Calcul jours entre 2 dates
function daysBetween(d1,d2){return Math.round((new Date(d2)-new Date(d1))/(1000*60*60*24));}

// Revenus reservations d'une annee
function revsAnnee(pid,annee){
  var tot=0;
  for(var i=0;i<S.data.saisonnier.reservations.length;i++){
    var r=S.data.saisonnier.reservations[i];
    if(r.pid===pid&&r.debut.startsWith(String(annee)))tot+=r.prix||0;
  }
  return tot;
}

// Charges saisonniere d'une annee
function chargesAnnee(pid,annee){
  for(var i=0;i<S.data.saisonnier.charges.length;i++){
    var c=S.data.saisonnier.charges[i];
    if(c.pid===pid&&c.annee===annee)return c;
  }
  return null;
}

function totalChargesSais(c){
  if(!c)return 0;
  var t=((c.eau||0)+(c.electricite||0)+(c.menage||0)+(c.copro||0));
  if(c.divers)for(var i=0;i<c.divers.length;i++)t+=+c.divers[i].mt||0;
  return t;
}

function render(){
  var d=S.data;
  var prop=null;
  for(var i=0;i<d.props.length;i++){if(d.props[i].id===S.pid){prop=d.props[i];break;}}
  var rev=0,ch=0,sy=0;
  for(var i=0;i<d.props.length;i++){var p=d.props[i];if(p.stat==="loue"){rev+=p.loyer;ch+=p.charges;sy+=(p.syn?p.syn.cotis:0);}}
  var imp=0;for(var i=0;i<d.loyers.length;i++){if(d.loyers[i].stat==="impaye")imp+=d.loyers[i].mt;}
  var trc=0;for(var i=0;i<d.travaux.length;i++)trc+=(+d.travaux[i].mt||0);
  var unr=0;for(var i=0;i<d.mails.length;i++){if(!d.mails[i].lu)unr++;}
  var alc=0;for(var i=0;i<d.loyers.length;i++){if(d.loyers[i].stat==="impaye"||d.loyers[i].stat==="retard")alc++;}

  document.getElementById("backBtn").style.display=(S.nav==="det"||S.nav==="sdet")?"block":"none";
  document.getElementById("addBtn").style.display=(S.nav==="sais")?"none":"block";
  document.getElementById("addBtn").onclick=(S.nav==="sais")?null:function(){opAP();};

  var navs=[["db","&#127968;","Accueil",0],["biens","&#127962;","Biens",0],["loyers","&#128182;","Loyers",alc],["charges","&#128200;","Charges",0],["sais","&#9728;","Saisonnier",0],["more","&#8943;","Plus",unr]];
  var nb="";
  for(var i=0;i<navs.length;i++){
    var nv=navs[i];
    nb+='<button class="nb '+(S.nav===nv[0]||((S.nav==="det"||S.nav==="sdet")&&nv[0]==="biens")?"on":"")+'" onclick="gn(\''+nv[0]+'\')"><div style="position:relative;display:inline-block"><span class="ic">'+nv[1]+'</span>'+(nv[3]>0?'<span style="position:absolute;top:-3px;right:-6px;background:#e53935;color:#fff;font-size:.5rem;padding:1px 4px;border-radius:10px">'+nv[3]+'</span>':"")+'</div><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52px">'+nv[2]+'</span></button>';
  }
  document.getElementById("bnav").innerHTML=nb;

  var h="";
  var main=document.getElementById("main");

  // ══ DASHBOARD ══
  if(S.nav==="db"){
    h+='<div style="margin-bottom:1rem"><h1 style="font-size:1.2rem;font-weight:700;color:#1a3a2a">Bonjour &#128075;</h1><p style="color:#8a7968;font-size:.8rem">'+new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})+'</p></div>';
    var totSais=0;
    for(var i=0;i<d.saisonnier.props.length;i++)totSais+=revsAnnee(d.saisonnier.props[i].id,new Date().getFullYear());
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem">';
    var kpis=[["&#128182;","Revenus/mois",fmt(rev),"loyers"],["&#128200;","Net/mois",fmt(rev-ch-sy),"apres charges"],["&#9728;","Saisonnier",fmt(totSais),"revenus "+new Date().getFullYear()],["&#9888;","Impayes",fmt(imp),"a recouvrer",imp>0]];
    for(var i=0;i<kpis.length;i++){var k=kpis[i];h+='<div class="kpi" style="border-left:3px solid '+(k[4]?"#c0392b":"#1a3a2a")+'"><div style="font-size:1.1rem;margin-bottom:.3rem">'+k[0]+'</div><div style="font-size:.62rem;color:#8a7968;text-transform:uppercase">'+k[1]+'</div><div style="font-size:1.1rem;font-weight:700;color:'+(k[4]?"#c0392b":"#2d2820")+';margin:.2rem 0 .1rem">'+k[2]+'</div><div style="font-size:.65rem;color:#a89a88">'+k[3]+'</div></div>';}
    h+='</div>';
    var als=[];
    for(var i=0;i<d.loyers.length;i++){var l=d.loyers[i];if(l.stat==="impaye"||l.stat==="retard"){for(var j=0;j<d.props.length;j++){if(d.props[j].id===l.pid){als.push({t:l.stat==="impaye"?"d":"w",tx:(l.stat==="impaye"?"Impaye ":"Retard ")+ml(l.mois)+" - "+d.props[j].nom,pid:d.props[j].id});break;}}}}
    if(als.length>0){h+='<div class="card"><div class="sh"><h3 class="st">&#9889; Alertes</h3></div>';for(var i=0;i<als.length;i++){var a=als[i];h+='<div class="row" onclick="gd('+a.pid+',\'loyers\')" style="cursor:pointer"><span style="width:7px;height:7px;border-radius:50%;background:'+(a.t==="d"?"#e53935":"#ff9800")+';flex-shrink:0"></span><span style="font-size:.83rem;color:#2d2820;flex:1">'+esc(a.tx)+'</span><span>&#8250;</span></div>';}h+='</div>';}
    h+='<div class="card"><div class="sh"><h3 class="st">&#127962; Mes biens</h3><button class="ab" onclick="opAP()">+ Ajouter</button></div>';
    for(var i=0;i<d.props.length;i++){var p=d.props[i];var sc=SPS[p.stat]||SPS.vacant;var ic=0;for(var j=0;j<d.loyers.length;j++){if(d.loyers[j].pid===p.id&&(d.loyers[j].stat==="impaye"||d.loyers[j].stat==="retard"))ic++;}h+='<div class="row" onclick="gd('+p.id+')" style="cursor:pointer"><span style="font-size:1.5rem">'+getImg(p)+'</span><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.nom)+'</div><div style="font-size:.72rem;color:#8a7968">'+p.type+' &middot; '+p.surf+'m2'+(p.loc?' &middot; '+esc(p.loc.nom):"")+'</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">'+bdg(sc,sc.lb)+(ic>0?bdg({bg:"#fdf2f2",tx:"#c0392b",dot:"#dc3545"},ic+" imp."):"")+'</div></div>';}
    h+='</div>';
  }

  // ══ BIENS ══
  else if(S.nav==="biens"){
    h+='<h1 style="font-size:1.2rem;font-weight:700;color:#1a3a2a;margin-bottom:1rem">'+d.props.length+' bien'+(d.props.length>1?"s":"")+'</h1>';
    for(var i=0;i<d.props.length;i++){
      var p=d.props[i];var sc=SPS[p.stat]||SPS.vacant;
      var ic=0;for(var j=0;j<d.loyers.length;j++){if(d.loyers[j].pid===p.id&&(d.loyers[j].stat==="impaye"||d.loyers[j].stat==="retard"))ic++;}
      var tr=0;for(var j=0;j<d.travaux.length;j++){if(d.travaux[j].pid===p.id)tr+=+d.travaux[j].mt||0;}
      h+='<div style="background:#fff;border-radius:1rem;box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:hidden;cursor:pointer;margin-bottom:1rem" onclick="gd('+p.id+')">';
      h+='<div style="background:#e8f4fd;padding:1rem;display:flex;justify-content:space-between;align-items:flex-start"><div style="display:flex;align-items:center;gap:.65rem"><span style="font-size:2rem">'+getImg(p)+'</span><div><div style="font-weight:700;font-size:.95rem">'+esc(p.nom)+'</div><div style="font-size:.72rem;color:#8a7968">'+p.type+' &middot; '+p.surf+'m2</div></div></div>'+bdg(sc,sc.lb)+'</div>';
      h+='<div style="padding:.85rem"><div style="font-size:.75rem;color:#8a7968;margin-bottom:.7rem">'+esc(p.adr)+'</div>';

function gn(v){S.nav=v;if(v!=="det"&&v!=="sdet")S.pid=null;render();}

function gsd(id){S.spid=id;S.tab="scalendrier";S.nav="sdet";render();}
function st(t){S.tab=t;render();}
function om(t,d){S.modal={t:t,d:d};renderM();}
function cm(){S.modal=null;renderM();}
function opAP(){S.modal={t:"ap",d:{}};renderM();}
function opEP(id,sec){var p=null;for(var i=0;i<S.data.props.length;i++){if(S.data.props[i].id===id){p=S.data.props[i];break;}}S.modal={t:"ep",d:p};renderM();if(sec===1){setTimeout(function(){tg("sloc");},50);}if(sec===2){setTimeout(function(){tg("ssyn");},50);}}
function opCharges(pid){S.modal={t:"charges",pid:pid};renderM();}
function opSC(pid,annee){S.modal={t:"sc",pid:pid,annee:annee};renderM();}
function opNR(date){S.modal={t:"nres",date:date};renderM();}
function tg(id){var el=document.getElementById(id);var ar=document.getElementById("ar_"+id);if(!el)return;var op=el.style.display==="none";el.style.display=op?"block":"none";if(ar)ar.innerHTML=op?"&#9660;":"&#9658;";}
function calNav(dir){S.scal.mois+=dir;if(S.scal.mois>11){S.scal.mois=0;S.scal.annee++;}if(S.scal.mois<0){S.scal.mois=11;S.scal.annee--;}render();}
function selCol(btn,col){var btns=document.querySelectorAll("[data-col]");for(var i=0;i<btns.length;i++)btns[i].style.border="3px solid transparent";btn.style.border="3px solid #333";btn.setAttribute("data-selected","1");}
function getSelCol(){var btns=document.querySelectorAll("[data-col]");for(var i=0;i<btns.length;i++){if(btns[i].getAttribute("data-selected"))return btns[i].getAttribute("data-col");}return COULEURS[0];}
function ajDivers(){var c=document.getElementById("divers_container");if(!c)return;var i=c.children.length;var d=document.createElement("div");d.style.cssText="display:grid;grid-template-columns:1fr auto;gap:.5rem;margin-bottom:.4rem";d.innerHTML='<input class="inp" id="f_dv_d_new'+i+'" placeholder="Description" style="font-size:.82rem"><input class="inp" type="number" id="f_dv_m_new'+i+'" placeholder="euros" style="font-size:.82rem;width:80px">';c.appendChild(d);}

function vm(id){
  var ml=null;for(var i=0;i<S.data.mails.length;i++){if(S.data.mails[i].id===id){ml=S.data.mails[i];break;}}
  if(!ml)return;
  for(var i=0;i<S.data.mails.length;i++){if(S.data.mails[i].id===id)S.data.mails[i].lu=true;}
  saveD();S.modal={t:"vm",d:Object.assign({},ml,{lu:true})};renderM();
}
function cdel(id){var p=null;for(var i=0;i<S.data.props.length;i++){if(S.data.props[i].id===id){p=S.data.props[i];break;}}if(p){S.modal={t:"cd",d:p};renderM();}}
function dp(id){
  S.data.props=S.data.props.filter(function(p){return p.id!==id;});
  S.data.loyers=S.data.loyers.filter(function(l){return l.pid!==id;});
  S.data.travaux=S.data.travaux.filter(function(t){return t.pid!==id;});
  S.data.courriers=S.data.courriers.filter(function(c){return c.pid!==id;});
  S.data.mails=S.data.mails.filter(function(m){return m.pid!==id;});
  S.data.charges=S.data.charges.filter(function(c){return c.pid!==id;});
  saveD();cm();S.nav="biens";S.pid=null;render();
}
function chSt(s){for(var i=0;i<S.data.props.length;i++){if(S.data.props[i].id===S.pid)S.data.props[i].stat=s;}saveD();render();}
function ulS(id,stat){
  for(var i=0;i<S.data.loyers.length;i++){
    if(S.data.loyers[i].id===id){
      S.data.loyers[i].stat=stat;
      if(stat==="paye")S.data.loyers[i].dp=new Date().toISOString().slice(0,10);
      break;
    }
  }
  saveD();render();
}
function ucS(id,stat){for(var i=0;i<S.data.courriers.length;i++){if(S.data.courriers[i].id===id){S.data.courriers[i].stat=stat;break;}}saveD();render();}
function delRes(id){
  if(!confirm("Supprimer cette reservation ?"))return;
  S.data.saisonnier.reservations=S.data.saisonnier.reservations.filter(function(r){return r.id!==id;});
  saveD();render();
}

function sl(){
  var mois=gv("f_mois");var mt=gv("f_mt");
  if(!mois||!mt){alert("Remplir mois et montant");return;}
  var pid=S.pid;
  if(!pid){var el=document.getElementById("f_pid");if(el)pid=+el.value;}
  if(!pid){alert("Selectionner un bien");return;}
  S.data.loyers.push({id:Date.now(),pid:pid,mois:mois,mt:+mt,stat:gv("f_st")||"paye",dp:gv("f_dp"),notes:gv("f_nt")});
  saveD();cm();render();
}
function stv(){
  var desc=gv("f_desc");var mt=gv("f_mt");
  if(!desc||!mt){alert("Remplir description et cout");return;}
  S.data.travaux.push({id:Date.now(),pid:S.pid,desc:desc,type:gv("f_ty")||"entretien",mt:+mt,prest:gv("f_pr"),date:gv("f_dt")||new Date().toISOString().slice(0,10),stat:gv("f_st")||"termine"});
  saveD();cm();render();
}
function scr(){
  var ti=gv("f_ti");var de=gv("f_de");
  if(!ti||!de){alert("Remplir titre et destinataire");return;}
  S.data.courriers.push({id:Date.now(),pid:S.pid,titre:ti,type:gv("f_ty")||"relance",dest:de,stat:"envoye",notes:gv("f_nt"),date:new Date().toISOString().slice(0,10)});
  saveD();cm();render();
}
function sml(){
  var ob=gv("f_ob");var a=gv("f_a");var cr=gv("f_cr");
  if(!ob||!a||!cr){alert("Remplir tous les champs");return;}
  S.data.mails.push({id:Date.now(),pid:S.pid,obj:ob,a:a,corps:cr,de:"moi",date:new Date().toISOString().slice(0,10),tag:gv("f_tg")||"autre",lu:true,ia:false});
  saveD();cm();render();
}
function sp(eid){
  var nm=gv("f_nm");var ad=gv("f_ad");
  if(!nm||!ad){alert("Remplir nom et adresse");return;}
  var ln=gv("f_ln");var loc=ln?{nom:ln,email:gv("f_le"),tel:gv("f_lt"),date:gv("f_ld")}:null;
  var sn=gv("f_sn");var syn=sn?{nom:sn,contact:gv("f_sc"),tel:gv("f_st2"),cotis:+gv("f_sco")||0}:null;
  var np={id:eid||Date.now(),nom:nm,adr:ad,type:gv("f_ty")||"Appartement",surf:+gv("f_sr")||0,loyer:+gv("f_ly")||0,charges:+gv("f_ch")||0,caution:+gv("f_ca")||0,stat:gv("f_st")||"vacant",notes:gv("f_nt"),img:"AP",loc:loc,syn:syn};
  if(eid){for(var i=0;i<S.data.props.length;i++){if(S.data.props[i].id===eid){np.img=S.data.props[i].img;S.data.props[i]=np;break;}}}
  else S.data.props.push(np);
  saveD();cm();if(eid&&S.nav==="det")S.pid=eid;render();
}
function scharges(pid,annee){
  var nc={pid:pid,annee:annee,eau:+gv("f_eau")||0,electricite:+gv("f_elec")||0,assurance:+gv("f_ass")||0,syndic:+gv("f_syn")||0,copro:+gv("f_copro")||0,taxe:+gv("f_taxe")||0};
  var found=false;
  for(var i=0;i<S.data.charges.length;i++){if(S.data.charges[i].pid===pid&&S.data.charges[i].annee===annee){S.data.charges[i]=nc;found=true;break;}}
  if(!found)S.data.charges.push(nc);
  saveD();cm();render();
}
function ssp(eid){
  var nm=gv("f_nm");var ad=gv("f_ad");
  if(!nm||!ad){alert("Remplir nom et adresse");return;}
  var np={id:eid||Date.now(),nom:nm,adr:ad,surf:+gv("f_sr")||0,prix_nuit:+gv("f_pn")||0,notes:gv("f_nt"),img:"VL"};
  if(eid){for(var i=0;i<S.data.saisonnier.props.length;i++){if(S.data.saisonnier.props[i].id===eid){S.data.saisonnier.props[i]=np;break;}}}
  else S.data.saisonnier.props.push(np);
  saveD();cm();if(eid&&S.nav==="sdet")S.spid=eid;render();
}
function snres(){
  var nom=gv("f_nom");var deb=gv("f_deb");var fin=gv("f_fin");var prix=gv("f_prix");
  if(!nom||!deb||!fin||!prix){alert("Remplir tous les champs obligatoires");return;}
  if(fin<=deb){alert("La date de depart doit etre apres l arrivee");return;}
  S.data.saisonnier.reservations.push({id:Date.now(),pid:S.spid,debut:deb,fin:fin,nom:nom,couleur:getSelCol(),prix:+prix,source:gv("f_src")||"manuel"});
  saveD();cm();render();
}
function ssc(pid,annee,nbExisting){
  var ch=chargesAnnee(pid,annee)||{};
  var nc={pid:pid,annee:annee,eau:+gv("f_eau")||0,electricite:+gv("f_elec")||0,menage:+gv("f_men")||0,copro:+gv("f_copro")||0,divers:ch.divers||[]};
  // Existants
  for(var i=0;i<nbExisting;i++){
    var d=gv("f_dv_d"+i);var mv=gv("f_dv_m"+i);
    if(d)nc.divers[i]={desc:d,mt:+mv||0};
  }
  // Nouveaux
  var c=document.getElementById("divers_container");
  if(c){var nd=c.children.length;for(var i=0;i<nd;i++){var d=gv("f_dv_d_new"+i);var mv=gv("f_dv_m_new"+i);if(d)nc.divers.push({desc:d,mt:+mv||0});}}
  var found=false;
  for(var i=0;i<S.data.saisonnier.charges.length;i++){if(S.data.saisonnier.charges[i].pid===pid&&S.data.saisonnier.charges[i].annee===annee){S.data.saisonnier.charges[i]=nc;found=true;break;}}
  if(!found)S.data.saisonnier.charges.push(nc);
  saveD();cm();render();
}
function ait(src){
  cm();
  var pid=S.data.props.length>0?S.data.props[0].id:null;
  var now=new Date().toISOString().slice(0,10);
  S.data.mails.push({id:Date.now(),pid:pid,date:now,obj:"Question charges - "+src,de:"locataire@email.fr",a:"moi",corps:"Bonjour,\n\nDes precisions sur les charges svp.\n\nCordialement",tag:"loyer",lu:false,ia:true});
  S.data.mails.push({id:Date.now()+1,pid:pid,date:now,obj:"Convocation AG",de:"syndic@immo.fr",a:"moi",corps:"Vous etes convoque a l AG annuelle.\n\nLe Syndic",tag:"syndic",lu:false,ia:true});
  saveD();alert("2 emails importes !");render();
}
function rst(){if(confirm("Reinitialiser toutes les donnees ?")){localStorage.removeItem(SK);S.data=JSON.parse(JSON.stringify(DEF));saveD();render();}}

document.getElementById("backBtn").addEventListener("click",function(){
  if(S.nav==="det"){S.nav="biens";S.pid=null;}
  else if(S.nav==="sdet"){S.nav="sais";S.spid=null;}
  else S.nav="db";
  render();
});
document.getElementById("aiBtn").addEventListener("click",function(){S.modal={t:"ait"};renderM();});
document.getElementById("addBtn").addEventListener("click",function(){opAP();});

render();
